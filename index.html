<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>英语萌宠乐园</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8A65">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语萌宠乐园">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --cream:#FFFDF7; --paper:#FFFFFF;
  --peach:#FF8A65; --peach-d:#E86A33; --peach-l:#FFE8DC;
  --mint:#4CAF93; --mint-l:#E3F5EF;
  --blue:#6EC1E4; --blue-l:#E6F4FB;
  --lock:#C4C4C4; --lock-l:#F0F0F0;
  --text:#2C2C2C; --text2:#6B6B6B; --text3:#9A9A9A;
  --line:#F0E6DC;
  --r:18px; --r-lg:24px;
  --sh:0 2px 10px rgba(200,140,110,.10);
  --sh-lg:0 8px 28px rgba(200,140,110,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Huawei Sans","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--cream); color:var(--text);
  font-size:16px; line-height:1.6;
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;background:var(--cream);position:relative}
#topbar{
  flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background:linear-gradient(135deg,#FF9B78,#FF8A65);color:#fff;
  display:flex;align-items:center;gap:10px;box-shadow:var(--sh);
}
#topbar .logo{font-size:19px;font-weight:800;letter-spacing:.5px;flex:1}
#topbar .logo small{display:block;font-size:11px;font-weight:500;opacity:.85;letter-spacing:0}
#topbar .chip{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
#topbar .chip b{font-size:15px}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}

#tabbar{
  flex:0 0 auto;position:absolute;left:0;right:0;bottom:0;z-index:60;
  display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px rgba(200,140,110,.10)
}
#tabbar button{flex:1;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);font-size:11px;font-weight:600}
#tabbar button.on{color:var(--peach-d)}
#tabbar button .ti{font-size:21px;line-height:1}
#tabbar button.on .ti{transform:translateY(-1px)}

/* ---------- generic ---------- */
.card{background:#fff;border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.sec-t{font-size:13px;font-weight:800;color:var(--text2);letter-spacing:1px;margin:18px 2px 8px}
.sec-t:first-child{margin-top:2px}
.muted{color:var(--text2)}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--peach);color:#fff;box-shadow:0 3px 0 #D9632F;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #D9632F}
.btn.g{background:var(--mint);box-shadow:0 3px 0 #3A8F79}
.btn.g:active{box-shadow:0 1px 0 #3A8F79}
.btn.o{background:#fff;color:var(--peach-d);border:2px solid var(--peach-l);box-shadow:none}
.btn.o:active{background:var(--peach-l)}
.btn.gray{background:#EDEDED;color:var(--text2);box-shadow:0 3px 0 #DCDCDC}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;box-shadow:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.p{background:var(--peach-l);color:var(--peach-d)}
.pill.g{background:var(--mint-l);color:#2E7F6B}
.pill.b{background:var(--blue-l);color:#2E7EA0}
.pill.y{background:#FFF4D6;color:#A87A16}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#FFE8DC,#FFF6EE);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .d{font-size:13px;color:var(--peach-d);font-weight:700}
.hero .m{font-size:22px;font-weight:800;margin:2px 0 8px}
.bar{height:9px;border-radius:99px;background:#F2E4DA;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB08A,#FF8A65);transition:width .5s}
.tasks{display:flex;flex-direction:column;gap:11px}
.tk{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;position:relative;border:2px solid transparent}
.tk.now{border-color:var(--peach);background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#FFB08A,#FF8A65) border-box}
.tk.done{background:var(--mint-l)}
.tk.lock{background:#FAFAFA;color:var(--text3)}
.tk .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:0 0 auto;background:var(--peach-l)}
.tk.done .ic{background:#CDEBE0}
.tk.lock .ic{background:var(--lock-l)}
.tk .tx{flex:1;min-width:0}
.tk .tx b{display:block;font-size:16px}
.tk .tx span{font-size:12.5px;color:var(--text2)}
.tk.lock .tx span{color:var(--text3)}
.tk .ck{font-size:24px;color:var(--mint);font-weight:900}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;background:var(--cream);z-index:80;display:none;flex-direction:column;max-width:820px;margin:0 auto;left:0;right:0}
#overlay.on{display:flex}
#ov-head{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;background:linear-gradient(135deg,#FF9B78,#FF8A65);color:#fff;display:flex;align-items:center;gap:10px}
#ov-head b{font-size:17px;flex:1}
#ov-head .x{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
#ov-body{flex:1 1 auto;overflow-y:auto;padding:16px 14px calc(30px + env(safe-area-inset-bottom))}
.timer{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.24);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}

/* vocab */
.wcard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:26px 18px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.wcard .w{font-size:38px;font-weight:800;letter-spacing:.5px;line-height:1.15;word-break:break-word}
.wcard .ipa{color:var(--text2);font-size:17px}
.wcard .pos{color:var(--peach-d);font-size:13px;font-weight:800}
.wcard .cn{font-size:22px;font-weight:700;color:#2E7F6B}
.wcard .ex{background:#FAFAF8;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.55}
.wcard .exc{font-size:13px;color:var(--text2)}
.spk{width:54px;height:54px;border-radius:50%;background:var(--peach-l);color:var(--peach-d);font-size:24px;display:inline-flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.answers button{min-height:56px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:15px;padding:6px}
.answers button.no{color:var(--peach-d)}
.answers button.yes{color:#2E7F6B}

/* reader */
.paper{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--sh);padding:20px 18px;font-size:19px;line-height:1.85;letter-spacing:.2px}
.paper h3{margin:0 0 12px;font-size:20px;color:var(--peach-d)}
.paper .cn{font-size:14px;color:var(--text2);line-height:1.7;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.opt{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;padding:13px 15px;box-shadow:var(--sh);margin-bottom:9px;font-size:15.5px;line-height:1.5}
.opt.sel{border:2px solid var(--peach);background:var(--peach-l)}
.opt.ok{border:2px solid var(--mint);background:var(--mint-l)}
.opt.bad{border:2px solid #E88;border:2px solid #E8A0A0;background:#FDEDED}
.rec{width:96px;height:96px;border-radius:50%;background:var(--peach);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 6px 0 #D9632F}
.rec.on{background:#E4574C;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.bdg{background:#fff;border-radius:var(--r);padding:10px 6px;text-align:center;box-shadow:var(--sh);position:relative}
.bdg.lk{background:#FAFAFA;box-shadow:none;opacity:.62}
.bdg svg{width:100%;height:auto;display:block}
.bdg .nm{font-size:12px;font-weight:700;margin-top:4px;line-height:1.3}
.bdg.lk .nm{color:var(--text3)}
.bdg .tg{position:absolute;top:6px;right:6px;font-size:10px;background:var(--peach-l);color:var(--peach-d);border-radius:6px;padding:1px 5px;font-weight:800}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:11px;color:var(--text3);font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:8px;background:#F4EFEA;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3)}
.cal .c.d1{background:var(--mint);color:#fff;font-weight:800}
.cal .c.d2{background:#A8DCC9;color:#fff;font-weight:700}
.cal .c.today{outline:2px solid var(--peach);outline-offset:1px}

/* album */
.alb{background:#fff;border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.alb img{width:100%;border-radius:14px;display:block;margin-bottom:10px}
.alb .note{background:#FFF9F3;border-left:4px solid var(--peach);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(60,40,30,.45);padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:24px;padding:22px 20px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h3{margin:0 0 10px;font-size:19px}
.mbox p{margin:0 0 14px;color:var(--text2);font-size:14.5px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:12px 13px;border:2px solid var(--line);border-radius:13px;background:#FDFCFA;font-size:16px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--peach)}
.mbtns{display:flex;gap:10px;margin-top:6px}
.mbtns .btn{flex:1}

/* celebrate */
#celeb{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;pointer-events:none;flex-direction:column;gap:6px}
#celeb.on{display:flex}
#celeb .big{font-size:52px;font-weight:900;color:#fff;text-shadow:0 6px 18px rgba(232,106,51,.55);animation:pop2 .6s cubic-bezier(.2,1.6,.4,1)}
#celeb .sub{font-size:21px;font-weight:800;color:#fff;text-shadow:0 4px 12px rgba(232,106,51,.5);animation:pop2 .6s .1s backwards cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-16px;width:10px;height:15px;z-index:119;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(760deg);opacity:.85}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(44,44,44,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:130;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1}

/* wheel */
.wheel-wrap{position:relative;width:250px;height:250px;margin:6px auto 14px}
.wheel-wrap svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.15,.85,.25,1)}
.wheel-wrap .pin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .t{flex:1;min-width:0}
.list-item .t b{display:block;font-size:15px}
.list-item .t span{font-size:12.5px;color:var(--text2)}
.empty{text-align:center;color:var(--text3);padding:34px 10px;font-size:14px}
.quote{background:linear-gradient(135deg,#FFF6EE,#FFE8DC);border-radius:var(--r-lg);padding:18px;text-align:center;margin-top:14px}
.quote .en{font-size:18px;font-weight:700;color:var(--peach-d);line-height:1.5}
.quote .cn{font-size:13px;color:var(--text2);margin-top:6px}
</style>
</head>

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mStart(m){return new Date(2026,8+(m-1),1);}
function mEnd(m){return new Date(2026,8+m,0);}
function moduleOf(s){const d=parse(s);let m=(d.getFullYear()-2026)*12+(d.getMonth()-8)+1;return Math.min(18,Math.max(1,m));}
function weekKey(s){const d=parse(s);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return fmt(d);}

/* ---------- 语音：预录音频优先 + 系统 TTS 兜底 ---------- */
let voices=[],ttsReady=false,ttsVoice=null;   /* ttsVoice 必须先声明：loadVoices 在下面立刻会被调用 */
function loadVoices(){try{voices=window.speechSynthesis?speechSynthesis.getVoices():[];}catch(e){voices=[];}
 const en=voices.filter(v=>/^en/i.test(v.lang));ttsReady=en.length>0;
 ttsVoice=null;if(st.ttsOK!==ttsReady){st.ttsOK=ttsReady;save();}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){if(!voices.length)loadVoices();
 if(!ttsVoice){const en=voices.filter(v=>/^en/i.test(v.lang));
  const score=v=>{const n=(v.name||'')+' '+(v.voiceURI||'');let s=0;
   if(/natural|online|neural/i.test(n))s+=40;            /* 神经网络音色，自然度最高 */
   if(/google/i.test(n))s+=30;
   if(/ana|jenny|aria|ava|emma|michelle|libby|sonia|maisie/i.test(n))s+=20;
   if(/female|woman|girl/i.test(n))s+=6;
   if(st.voice==='libby'||st.voice==='maisie'){if(/en-GB/i.test(v.lang))s+=15;}
   else if(/en-US/i.test(v.lang))s+=10;
   return s;};
  en.sort((a,b)=>score(b)-score(a));
  ttsVoice=en[0]||null;}
 return ttsVoice;}
function speak(t,rate,cb){try{
 if(!window.speechSynthesis){if(cb)cb(false);return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);const v=pickVoice();
 if(v)u.voice=v;u.lang=(v&&v.lang)||(st.voice==='ana'?'en-US':'en-GB');
 u.rate=rate||0.9;u.pitch=st.pitch||1.25;   /* 1.0 太平缓，1.25 更接近童声 */
 if(cb){u.onend=()=>cb(true);u.onerror=()=>cb(false);}
 speechSynthesis.speak(u);
}catch(e){if(cb)cb(false);}}

/* ---- 预录音频（edge-tts 微软神经网络音色，接近真人） ---- */
const AUDIO_CACHE={},AUDIO_FAIL={};
let curAudio=null;
function aSlug(k){return String(k).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function voiceDir(){return st.voice==='libby'?'libby':st.voice==='maisie'?'maisie':'ana';}
function readerURL(id){return 'audio/readers/'+voiceDir()+'/r'+id+'.mp3';}
/* 单词索引：word -> [起始秒, 时长秒, 月份] */
let WIDX=null,WIDXing=false,WIDXV='';
/* 单词音频目录：ana 在 audio/words/ 根，maisie 在 audio/words/maisie/ */
function wordDir(){return st.voice==='maisie'?'maisie/':'';}
function loadWIdx(cb){
 const vd=wordDir();
 if(WIDX&&WIDXV===vd){if(cb)cb();return;}
 if(WIDXing){if(cb)setTimeout(cb,400);return;}
 WIDXing=true;
 fetch('audio/words/'+vd+'index.json').then(r=>r.ok?r.json():null).then(j=>{
  WIDX={};WIDXV=vd;
  /* 统一转小写：索引里 Monday/August/T-shirt 等保留了大写，播放时按小写查，不转会 miss */
  if(j)Object.keys(j).forEach(m=>{const o=j[m];Object.keys(o).forEach(w=>{WIDX[w.toLowerCase()]=[o[w][0],o[w][1],m];});});
  WIDXing=false;if(cb)cb();
 }).catch(()=>{WIDX={};WIDXing=false;if(cb)cb();});
}
function playWord(w,rate,cb){
 if(!WIDX||!WIDX[w])return false;
 const it=WIDX[w],key='w'+wordDir()+'m'+it[2];
 try{
  let a=AUDIO_CACHE[key];
  if(!a){a=new Audio('audio/words/'+wordDir()+'m'+it[2]+'.mp3');a.preload='auto';AUDIO_CACHE[key]=a;
   a.addEventListener('error',()=>{AUDIO_FAIL[key]=1;});}
  if(AUDIO_FAIL[key])return false;
  if(curAudio&&curAudio!==a){try{curAudio.pause();}catch(e){}}
  a.playbackRate=Math.max(0.5,Math.min(2,rate||1));
  a.onerror=()=>{AUDIO_FAIL[key]=1;};
  a.currentTime=it[0];
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{AUDIO_FAIL[key]=1;speak(w,rate,cb);});
  clearTimeout(a._wt);
  a._wt=setTimeout(()=>{try{a.pause();}catch(e){}if(cb)cb(true);},(it[1]/(rate||1)+0.18)*1000);
  curAudio=a;
  return true;
 }catch(e){return false;}
}
/* say(text, rate, {kind:'word'|'reader', key:...}, cb) */
function say(text,rate,opt,cb){
 opt=opt||{};
 if(st.voice==='sys'){speak(text,rate,cb);return;}
 if(st.audio!==false&&opt.kind&&opt.key!=null){
  if(opt.kind==='word'){
   const r=rate||0.9;
   loadWIdx(()=>{if(!playWord(String(opt.key).toLowerCase(),r,cb))speak(text,r,cb);});
   return;
  }
  const url=readerURL(opt.key);
  if(!AUDIO_FAIL[url]){playFile(url,rate||0.9,text,rate||0.9,cb);return;}
 }
 speak(text,rate,cb);
}
function playFile(url,rate,ftxt,frate,cb){
 const fail=()=>{AUDIO_FAIL[url]=1;speak(ftxt,frate,cb);};
 try{
  if(curAudio&&curAudio!==AUDIO_CACHE[url]){try{curAudio.pause();curAudio.currentTime=0;}catch(e){}}
  let a=AUDIO_CACHE[url];
  if(!a){a=new Audio(url);AUDIO_CACHE[url]=a;
   a.addEventListener('error',()=>{AUDIO_FAIL[url]=1;});}
  a.playbackRate=Math.max(0.5,Math.min(2,rate||1));
  a.onended=()=>{if(cb)cb(true);};
  a.onerror=fail;
  a.currentTime=0;
  const p=a.play();
  if(p&&p.catch)p.catch(fail);
  curAudio=a;
 }catch(e){fail();}
}
function stopSay(){try{if(curAudio){curAudio.pause();curAudio.currentTime=0;}}catch(e){}
 try{speechSynthesis.cancel();}catch(e){}}
/* 预加载下一篇/下一词，减少等待 */
function preload(opt){if(!opt||!opt.kind||opt.key==null)return;
 const url=audioURL(opt.kind,opt.key);
 if(AUDIO_CACHE[url]||AUDIO_FAIL[url])return;
 try{const a=new Audio();a.preload='auto';a.src=url;AUDIO_CACHE[url]=a;}catch(e){}}

let rec=null,chunks=[],recBlob=null;
function canRec(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function startRec(){
 return navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
  let mt='';['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].some(m=>{if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){mt=m;return true;}return false;});
  rec=new MediaRecorder(s,mt?{mimeType:mt}:undefined);chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.start();return true;
 }).catch(e=>{toast('麦克风未授权：请在浏览器设置里允许麦克风');return false;});
}
function stopRec(){return new Promise(res=>{if(!rec){res(null);return;}
 rec.onstop=()=>{const b=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});
  try{rec.getTracks&&0;}catch(e){}
  if(rec.stream)rec.stream.getTracks().forEach(t=>t.stop());
  recBlob=b;res(b);};rec.stop();});}
function audioTag(b){return '<audio controls src="'+URL.createObjectURL(b)+'" style="width:100%;margin-top:10px"></audio>';}

const PRIZES=[
 {n:'免打卡卡 ×1',w:35},{n:'星星 ×20',w:25},{n:'今晚我选晚餐',w:15},
 {n:'周末出游一次',w:10},{n:'一本新绘本',w:10},{n:'妈妈陪睡讲故事',w:5}
];
function taskLotto(){
 if(st.lotto.chances<=0){toast('还没有抽奖机会');return;}
 const cols=['#FF8A65','#FFC46B','#4CAF93','#6EC1E4','#F49AC1','#A5D86E'];
 const n=PRIZES.length;let paths='';
 PRIZES.forEach((p,i)=>{const a0=i*2*Math.PI/n-Math.PI/2,a1=(i+1)*2*Math.PI/n-Math.PI/2;
  const x0=50+45*Math.cos(a0),y0=50+45*Math.sin(a0),x1=50+45*Math.cos(a1),y1=50+45*Math.sin(a1);
  paths+='<path d="M50 50 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A45 45 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+cols[i]+'" stroke="#fff" stroke-width="1.5"/>';
  const am=(a0+a1)/2;
  paths+='<text x="'+(50+28*Math.cos(am)).toFixed(1)+'" y="'+(50+28*Math.sin(am)).toFixed(1)+'" font-size="6.5" fill="#fff" text-anchor="middle" font-weight="700">'+esc(p.n.length>6?p.n.slice(0,6):p.n)+'</text>';});
 ov('🎁 周日抽奖','<div class="wheel-wrap"><div class="pin">📍</div><svg id="wheel" viewBox="0 0 100 100">'+paths+'</svg></div>'+
  '<div class="tiny muted" style="text-align:center">剩余 '+st.lotto.chances+' 次机会</div>'+
  '<button class="btn block" style="margin-top:14px" data-act="spin">开始转</button>','');
}
function doSpin(){
 if(st.lotto.chances<=0)return;
 const total=PRIZES.reduce((a,b)=>a+b.w,0);let r=Math.random()*total,idx=0;
 for(let i=0;i<PRIZES.length;i++){r-=PRIZES[i].w;if(r<=0){idx=i;break;}}
 const n=PRIZES.length;const seg=360/n;
 const target=360*5-(idx*seg+seg/2);
 const w=document.getElementById('wheel');
 w.style.transform='rotate('+target+'deg)';
 st.lotto.chances--;
 st.lotto.history.push({d:today(),p:PRIZES[idx].n});
 if(PRIZES[idx].n.indexOf('星星')>=0)st.stars+=20;
 if(PRIZES[idx].n.indexOf('免打卡卡')>=0)st.shields.cards++;
 save();
 setTimeout(()=>{confetti(40);celebrate('恭喜！',PRIZES[idx].n);
  setTimeout(()=>{const b=document.querySelector('#ov-body .btn');if(b){b.textContent='再抽一次';b.disabled=st.lotto.chances<=0;}render();},1400);},4100);
}

  case 'task':{
   const t=a.dataset.t;
   if(!taskOpen(t)){toast('先完成上一步哦');return;}
   if(taskDone(t)){toast('这项已经完成啦 ✅');return;}
   ({vocab:taskVocab,read:taskRead,listen:taskListen,diary:taskDiary})[t]();break;}
  /* 背词 */
  case 'spk':say(a.dataset.t,0.85,{kind:'word',key:a.dataset.t});break;
  case 'spkSlow':{const _w=wById(vc.dic.list[vc.dic.i]);say(_w.w,0.6,{kind:'word',key:_w.w});break;}
  case 'vcAns':{vc.showAns=true;const ok=a.dataset.v==='1';vc.total++;
   if(ok){vc.correct++;grade(vc.ids[vc.i],true);}else{vc.wrong.push(vc.ids[vc.i]);grade(vc.ids[vc.i],false);}
   save();vocabCard();break;}
  case 'vcNext':{vc.showAns=false;vc.i++;vocabCard();break;}
  case 'dicCheck':{
   const w=wById(vc.dic.list[vc.dic.i]);const v=(document.getElementById('dicIn').value||'').trim().toLowerCase();
   const ok=v===w.w.toLowerCase();
   if(ok){vc.dic.ok++;grade(vc.dic.list[vc.dic.i],true);toast('拼写正确 ✓');}
   else{grade(vc.dic.list[vc.dic.i],false);
    document.getElementById('dicMsg').innerHTML='<b style="color:#E86A33">正确拼写：'+esc(w.w)+'</b> · 明天再练';
    document.getElementById('dicIn').value=w.w;say(w.w,0.7,{kind:'word',key:w.w});save();
    setTimeout(()=>{vc.dic.i++;dictCard();},1700);return;}
   save();vc.dic.i++;dictCard();break;}
  case 'dicHint':{const w=wById(vc.dic.list[vc.dic.i]);grade(vc.dic.list[vc.dic.i],false);save();
   document.getElementById('dicMsg').innerHTML='<b>'+esc(w.w)+'</b> · <span class="muted">'+esc(w.cn||'')+'</span>';
   document.getElementById('dicIn').value=w.w;say(w.w,0.7,{kind:'word',key:w.w});
   setTimeout(()=>{vc.dic.i++;dictCard();},1700);break;}
  case 'vcFinish':finishVocab();break;
  /* 跟读 */
  case 'playFull':say(rd.r.text,0.85,{kind:'reader',key:rd.r.id});break;
  case 'playSlow':say(rd.r.text,0.7,{kind:'reader',key:rd.r.id});break;
  case 'playFast':say(rd.r.text,1.0,{kind:'reader',key:rd.r.id});break;
  case 'rec':{
   if(!canRec()){toast('当前环境不支持录音，请用家长端导出的链接打开');return;}
   if(rd.recording){stopRec().then(b=>{rd.recording=false;rd.blob=b;rd.secs=Math.max(1,Math.round(b.size/6000));readStep();});}
   else{startRec().then(ok=>{if(ok){rd.recording=true;readStep();}});}
   break;}
  case 'readDone':{
   if(!rd.blob||rd.secs<20){toast('再录长一点吧（至少 20 秒）');return;}
   finishTask('read',{secs:rd.secs});ovClose();setTimeout(()=>{confetti(24);toast('跟读完成 ✅ 解锁听力');},150);break;}
  /* 听力 */
  case 'lp1':say(todayReader().text,0.8,{kind:'reader',key:todayReader().id});break;
  case 'lp2':say(todayReader().text,0.9,{kind:'reader',key:todayReader().id});break;
  case 'lshow':{const el=document.getElementById('lText');el.style.display=el.style.display==='none'?'block':'none';break;}
  case 'lq':{
   const i=+a.dataset.q,ok=a.dataset.ok==='1';
   a.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
   a.classList.add(ok?'ok':'bad');
   window._lq.ans[i]=ok;
   const n=Object.keys(window._lq.ans).length;
   if(n>=window._lq.qs.length){
    const c=Object.values(window._lq.ans).filter(Boolean).length;
    if(c>=1){setTimeout(()=>{finishTask('listen',{ok:c});ovClose();setTimeout(()=>{confetti(24);toast('听力完成 ✅ 解锁说+写');},150);},700);}
    else{setTimeout(()=>{document.getElementById('lResult').innerHTML='<div class="card" style="text-align:center"><div class="tiny muted">再听一遍试试，听完可以看原文对照</div><button class="btn block sm" style="margin-top:10px" data-act="lp1">再听一次</button></div>';window._lq.ans={};},600);}
   }
   break;}
  /* 日记 */
  case 'drec':{
   if(!canRec()){toast('当前环境不支持录音');return;}
   if(dr.recording){stopRec().then(b=>{dr.recording=false;dr.blob=b;dr.secs=Math.max(1,Math.round(b.size/6000));diaryStep();});}
   else{startRec().then(ok=>{if(ok){dr.recording=true;diaryStep();}});}
   break;}
  case 'dSave':{
   const t=(document.getElementById('dText').value||'').trim();
   const n=t.split(/\s+/).filter(Boolean).length;
   if(n<8){toast('再写长一点，至少 8 个词');return;}
   st.diary.push({d:today(),t:t,rec:dr.secs||0});save();
   finishTask('diary',{words:n});ovClose();break;}
  /* 小测 */
  case 'quiz':taskQuiz();break;
  case 'qAns':{const i=+a.dataset.i;const q=qz.qs[qz.i];
   if(i===q.a){qz.ok++;}else if(q.wid)qz.weak.push(q.wid);
   a.classList.add(i===q.a?'ok':'bad');
   if(i!==q.a)a.parentNode.querySelectorAll('.opt').forEach(x=>{if(x.dataset.i==q.a)x.classList.add('ok');});
   setTimeout(()=>{qz.i++;quizStep();},620);break;}
  case 'qDone':ovClose();break;
  /* 抽奖 */
  case 'lotto':taskLotto();break;
  case 'spin':doSpin();break;
  /* 我的 */
  case 'editGoal':{
   modal('<h3>我的目标</h3><p>想变成什么样？随时可以改。</p>'+
    '<div class="fld"><textarea id="gIn" rows="3" placeholder="例如：我想看懂英文动画片">'+esc(st.goal)+'</textarea></div>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn" data-act="goalSave">保存</button></div>');break;}
  case 'goalSave':{st.goal=document.getElementById('gIn').value.trim();save();modalClose();toast('已保存');render();break;}
  case 'ttsTest':{speak('Hello! Practice makes perfect.',0.85,ok=>{toast(ok?'英文语音正常 🔊':'没有英文语音，请检查系统设置');});break;}
  case 'setVoice':{st.voice=a.dataset.v;st.voiceSet=1;ttsVoice=null;WIDX=null;save();render();
   const v=VOICE_OPT.find(x=>x.id===st.voice);
   setTimeout(()=>{say(v.demo,0.9,{kind:'word',key:'hello'});},120);break;}
  case 'toggleAudio':{st.audio=(st.audio===false);save();render();
   toast(st.audio?'预录音频已开启':'已切换为系统语音');break;}
  case 'pitch':{st.pitch=Math.max(0.8,Math.min(1.8,+((st.pitch||1.25)+ +a.dataset.v).toFixed(2)));
   save();render();speak('Hello! This is my new voice.',0.9);break;}
  case 'redeem':{const r=st.rewards[+a.dataset.i];if(st.stars<r.cost){toast('星星不够');return;}
   st.stars-=r.cost;save();confetti(30);celebrate('兑换成功',r.name);render();break;}
  case 'album':askAlbum(+a.dataset.m);break;
  /* 家长端 */
  case 'pinGo':{const v=(document.getElementById('pinIn').value||'').trim();
   if(v===st.pin){parentOK=true;render();}else{toast('密码不对');}break;}
  case 'cardAdd':{st.shields.cards++;save();render();break;}
  case 'leave':{
   modal('<h3>请假</h3><p>期间不中断连续打卡记录。</p><div class="fld"><label>请假到哪一天</label><input type="date" id="lvIn" value="'+addDays(today(),6)+'"></div>'+
    '<div class="mbtns"><button class="btn gray" data-act="leaveClear">取消请假</button><button class="btn" data-act="leaveSave">确定</button></div>');break;}
  case 'leaveSave':{st.shields.leaveUntil=document.getElementById('lvIn').value;save();modalClose();render();break;}
  case 'leaveClear':{st.shields.leaveUntil='';save();modalClose();render();break;}
  case 'setLevel':{
   modal('<h3>读物等级</h3><p>L1 最简单，L6 最接近 KET。锁定后不再自动调整。</p>'+
    '<div class="fld"><label>等级</label><select id="lvSel">'+[1,2,3,4,5,6].map(i=>'<option value="'+i+'" '+(curLevel()===i?'selected':'')+'>L'+i+' · '+LV_NAME[i]+' · '+LV_WORD[i]+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label><input type="checkbox" id="lvLock" '+(st.levelLock?'checked':'')+'> 锁定等级，不自动调整</label></div>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn" data-act="lvSave">保存</button></div>');break;}
  case 'lvSave':{st.level=+document.getElementById('lvSel').value;st.levelLock=document.getElementById('lvLock').checked;save();modalClose();render();break;}
  case 'forceDone':{const d=getDay();['vocab','read','listen','diary'].forEach(k=>{if(!d.tasks[k])d.tasks[k]={done:true,at:Date.now(),by:'parent'};});save();checkDay();render();break;}
  case 'addReward':{
   modal('<h3>添加兑换项</h3><div class="fld"><label>名称</label><input id="rName" placeholder="例如：一本绘本"></div>'+
    '<div class="fld"><label>需要星星</label><input id="rCost" type="number" value="30"></div>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn" data-act="rSave">添加</button></div>');break;}
  case 'rSave':{const n=document.getElementById('rName').value.trim();const c=+document.getElementById('rCost').value||30;
   if(!n){toast('填个名字');return;}st.rewards.push({name:n,cost:c});save();modalClose();render();break;}
  case 'delReward':{st.rewards.splice(+a.dataset.i,1);save();render();break;}
  case 'export':doExport();break;
  case 'import':document.getElementById('impFile').click();break;
  case 'chPin':{
   modal('<h3>修改密码</h3><div class="fld"><input id="p1" type="password" inputmode="numeric" placeholder="新密码"></div>'+
    '<div class="fld"><input id="p2" type="password" inputmode="numeric" placeholder="再输入一次"></div>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn" data-act="pinSave">保存</button></div>');break;}
  case 'pinSave':{const p1=document.getElementById('p1').value.trim(),p2=document.getElementById('p2').value.trim();
   if(!p1||p1!==p2){toast('两次不一致');return;}st.pin=p1;save();modalClose();toast('已修改');break;}
  case 'exportAlbum':exportAlbum();break;
  case 'wipe':{
   modal('<h3>⚠️ 清空全部数据</h3><p>打卡、星星、勋章、相册都会被删除，且无法恢复。建议先导出备份。</p>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn gray" data-act="wipe2">确认清空</button></div>');break;}
  case 'wipe2':{localStorage.removeItem(LS);location.reload();break;}
  case 'addExam':{
   modal('<h3>记录模考成绩</h3><div class="fld"><label>日期</label><input type="date" id="eD" value="'+today()+'"></div>'+
    '<div class="fld"><label>分数（Cambridge Scale 100-150）</label><input type="number" id="eS" value="120"></div>'+
    '<div class="fld"><label>备注</label><input id="eN" placeholder="例如：真题 3 · 阅读弱"></div>'+
    '<div class="mbtns"><button class="btn o" data-act="mClose">取消</button><button class="btn" data-act="eSave">保存</button></div>');break;}
  case 'eSave':{st.exam.push({d:document.getElementById('eD').value,score:+document.getElementById('eS').value,n:document.getElementById('eN').value});
   st.exam.sort((a,b)=>a.d.localeCompare(b.d));save();modalClose();render();break;}
  case 'peek':{
   const q=todayQueue();
   modal('<h3>今日单词</h3><p>先预习一遍，等下背起来更快。</p>'+
    q.newIds.map(id=>{const w=wById(id);return '<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b>'+esc(w.w)+'</b> '+
     (w.ip?'<span class="muted tiny">'+esc(w.ip)+'</span> ':'')+'<span class="muted">'+esc(w.cn||'')+'</span></div>';}).join(''));break;}
  case 'mClose':modalClose();break;
 }
});
function ovBodySet(h){document.getElementById('ov-body').innerHTML=h;}

/* ---------- modal ---------- */
function modal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('on');}
function modalClose(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')modalClose();});

/* ---------- 相册 ---------- */
function askAlbum(m){
 modal('<h3>M'+m+' 纪念页</h3><p>传一张这个月的照片，再写一句话给下个月的自己。</p>'+
  '<div class="fld"><label>照片</label><input type="file" id="alImg" accept="image/*"></div>'+
  '<div class="fld"><label>写给下个月的自己</label><textarea id="alNote" rows="3" placeholder="例如：下个月我要把 Part 1 全做对！">'+esc((st.album[m]&&st.album[m].note)||'')+'</textarea></div>'+
  '<div class="mbtns"><button class="btn o" data-act="mClose">稍后</button><button class="btn" data-act="alSave" data-m="'+m+'">保存</button></div>');
 const f=document.getElementById('alImg');
 f.onchange=()=>{const file=f.files[0];if(!file)return;
  const rd2=new FileReader();rd2.onload=ev=>{const img=new Image();img.onload=()=>{
   const max=560;const sc=Math.min(1,max/img.width);
   const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   window._albImg=c.toDataURL('image/jpeg',0.62);toast('照片已就绪，点保存');};img.src=ev.target.result;};
  rd2.readAsDataURL(file);};
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="alSave"]');if(!a)return;
 const m=a.dataset.m;st.album[m]=st.album[m]||{};
 if(window._albImg){st.album[m].photo=window._albImg;window._albImg=null;}
 st.album[m].note=(document.getElementById('alNote').value||'').trim();
 st.album[m].date=today();save();modalClose();toast('已保存 M'+m+' 纪念页');render();});

/* ---------- 导入导出 ---------- */
function doExport(){
 const blob=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='萌宠乐园备份_'+today()+'.json';a.click();toast('已导出，建议存到网盘或电脑');
}
function exportAlbum(){
 let h='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>英语萌宠乐园 · 成长纪念册</title>'+
  '<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FFFDF7;color:#2C2C2C;margin:0;padding:30px 18px}'+
  '.wrap{max-width:720px;margin:0 auto}h1{color:#E86A33;text-align:center}.m{background:#fff;border-radius:20px;padding:18px;margin:18px 0;box-shadow:0 2px 10px rgba(200,140,110,.12)}'+
  '.m img{width:100%;border-radius:14px;margin-bottom:10px}.note{background:#FFF6EE;border-left:4px solid #FF8A65;padding:10px 14px;border-radius:0 10px 10px 0}'+
  '.d{color:#6B6B6B;font-size:13px}@media print{body{background:#fff}}</style></head><body><div class="wrap">'+
  '<h1>英语萌宠乐园</h1><p style="text-align:center;color:#6B6B6B">'+(esc(st.name)||'二姐')+' 的 18 个月成长纪念册</p>';
 Object.keys(st.album).sort((a,b)=>a-b).forEach(k=>{const a=st.album[k];
  h+='<div class="m"><div class="d">M'+k+' · '+esc(a.date||'')+'</div>'+(a.photo?'<img src="'+a.photo+'">':'')+
   (a.note?'<div class="note">'+esc(a.note)+'</div>':'')+'</div>';});
 st.diary.slice(-60).forEach(d=>{h+='<div class="m"><div class="d">'+esc(d.d)+'</div><div>'+esc(d.t)+'</div></div>';});
 h+='<p style="text-align:center;color:#9A9A9A;font-size:13px;margin-top:30px">累计 ⭐ '+st.stars+' · 最长连续 '+st.best+' 天 · 已掌握 '+mastered()+' 词</p></div></body></html>';
 const blob=new Blob([h],{type:'text/html;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='成长纪念册_'+today()+'.html';a.click();toast('纪念册已导出，可打印或保存');
}
document.addEventListener('change',e=>{
 if(e.target.id!=='impFile')return;
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=ev=>{try{const o=JSON.parse(ev.target.result);
  if(!o||o.v!==1)throw 0;st=Object.assign(DEF(),o);save();toast('导入成功');render();
 }catch(err){toast('文件格式不对');}};r.readAsText(f);
});

/* ---------- PWA ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('已添加到主屏 🎉');});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

/* ---------- 首启引导 ---------- */
function firstRun(){
 if(st.name)return;
 modal('<h3>欢迎来到英语萌宠乐园 🎪</h3><p>这是属于你的英语小工具。每天 30 分钟，18 个月后你会集齐 18 只萌宠。</p>'+
  '<div class="fld"><label>你的名字（或昵称）</label><input id="nmIn" placeholder="二姐"></div>'+
  '<div class="fld"><label>开始日期</label><input type="date" id="sdIn" value="'+START+'"></div>'+
  '<div class="tiny muted">数据只保存在这台设备上，不会上传。家长端可以定期导出备份。</div>'+
  '<div class="mbtns"><button class="btn" data-act="frSave">开始吧</button></div>');
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="frSave"]');if(!a)return;
 st.name=(document.getElementById('nmIn').value||'').trim()||'二姐';
 st.start=document.getElementById('sdIn').value||START;
 save();modalClose();render();});

/* ---------- 特别勋章检查 ---------- */
function checkSpecials(){
 if(st.streak>=100&&!st.badges.s_100){st.badges.s_100=true;save();confetti(50);celebrate('百日坚持！','解锁 🔥 特别勋章');}
 const got=Array.from({length:18},(_,i)=>st.badges['m'+(i+1)]).filter(Boolean).length;
 if(got>=18&&!st.badges.s_all){st.badges.s_all=true;save();confetti(60);celebrate('萌宠全家福！','18 只全部集齐 🌈');}
}
render();
loadVoices();
checkSpecials();
firstRun();
setInterval(()=>{const k=today();if(window._lastDay!==k){window._lastDay=k;render();}},60000);
window._lastDay=today();
</script>
